<!doctype html>
<html lang="vi" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Forecast</title>
  <script src="/_sdk/element_sdk.js"></script>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&amp;family=DM+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
  html, body { height: 100%; }
  body {
    font-family: 'DM Sans', system-ui, sans-serif;
    background: radial-gradient(ellipse at top left, #fde68a 0%, transparent 50%),
                radial-gradient(ellipse at bottom right, #fca5a5 0%, transparent 50%),
                linear-gradient(135deg, #fef3c7 0%, #fed7aa 50%, #fecaca 100%);
  }
  .font-display { font-family: 'Fraunces', serif; font-variation-settings: "opsz" 144; }
  .glass {
    background: rgba(255, 255, 255, 0.5);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.6);
  }
  .city-btn.active {
    background: #1c1917;
    color: #fef3c7;
  }
  .sun-orb {
    background: radial-gradient(circle at 30% 30%, #fef08a, #f59e0b 60%, #b45309);
    box-shadow: 0 0 60px rgba(251,191,36,0.6), 0 0 120px rgba(251,146,60,0.4);
    animation: float 6s ease-in-out infinite;
  }
  @keyframes float {
    0%,100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-12px) rotate(8deg); }
  }
  .reveal { animation: reveal 0.7s cubic-bezier(0.22, 1, 0.36, 1) both; }
  @keyframes reveal {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .hour-card:hover { transform: translateY(-4px); }
  .hour-card { transition: transform 0.25s ease; }
  .day-row:hover { background: rgba(255,255,255,0.4); }
  .rain-drop {
    animation: rain 1.2s linear infinite;
  }
  @keyframes rain {
    0% { transform: translateY(-10px); opacity: 0; }
    30% { opacity: 1; }
    100% { transform: translateY(30px); opacity: 0; }
  }
</style>
  <style>body { box-sizing: border-box; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
 </head>
 <body class="h-full w-full">
  <main class="w-full h-full overflow-auto">
   <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-10"><!-- Header -->
    <header class="flex items-center justify-between mb-8 reveal">
     <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-full sun-orb"></div>
      <div>
       <h1 id="app-title" class="font-display text-2xl sm:text-3xl font-extrabold text-stone-900 leading-none">Weather</h1>
       <p id="app-subtitle" class="text-xs sm:text-sm text-stone-600 mt-0.5">Dự báo thời tiết</p>
      </div>
     </div>
     <div class="text-right">
      <div id="current-date" class="text-sm text-stone-700 font-medium"></div>
      <div id="current-time" class="font-display text-xl sm:text-2xl font-semibold text-stone-900"></div>
     </div>
    </header><!-- City selector -->
    <div id="city-tabs" class="flex gap-2 overflow-x-auto pb-2 mb-6 reveal" style="animation-delay: 0.1s"></div><!-- Main card -->
    <section class="glass rounded-3xl p-6 sm:p-10 mb-6 reveal" style="animation-delay: 0.2s">
     <div class="grid md:grid-cols-2 gap-8 items-center">
      <div>
       <div class="flex items-center gap-2 text-stone-700 mb-2"><i data-lucide="map-pin" class="w-4 h-4"></i> <span id="city-name" class="text-sm font-medium">—</span>
       </div>
       <div class="flex items-start gap-2"><span id="current-temp" class="font-display text-7xl sm:text-9xl font-extrabold text-stone-900 leading-none">--</span> <span class="font-display text-3xl sm:text-4xl font-semibold text-stone-700 mt-2">°C</span>
       </div>
       <div id="current-condition" class="font-display text-xl sm:text-2xl text-stone-800 mt-2 font-semibold">
        —
       </div>
       <div id="current-range" class="text-sm text-stone-600 mt-1">
        —
       </div>
       <div class="grid grid-cols-3 gap-3 mt-6">
        <div class="bg-white/40 rounded-2xl p-3">
         <div class="flex items-center gap-1.5 text-stone-600 text-xs mb-1"><i data-lucide="droplets" class="w-3.5 h-3.5"></i> Độ ẩm
         </div>
         <div id="stat-humidity" class="font-display text-xl font-bold text-stone-900">
          —
         </div>
        </div>
        <div class="bg-white/40 rounded-2xl p-3">
         <div class="flex items-center gap-1.5 text-stone-600 text-xs mb-1"><i data-lucide="wind" class="w-3.5 h-3.5"></i> Gió
         </div>
         <div id="stat-wind" class="font-display text-xl font-bold text-stone-900">
          —
         </div>
        </div>
        <div class="bg-white/40 rounded-2xl p-3">
         <div class="flex items-center gap-1.5 text-stone-600 text-xs mb-1"><i data-lucide="sun" class="w-3.5 h-3.5"></i> UV
         </div>
         <div id="stat-uv" class="font-display text-xl font-bold text-stone-900">
          —
         </div>
        </div>
       </div>
      </div>
      <div class="flex items-center justify-center relative min-h-[220px]">
       <div id="weather-visual" class="relative w-48 h-48 sm:w-64 sm:h-64 flex items-center justify-center"></div>
      </div>
     </div>
    </section><!-- Hourly -->
    <section class="glass rounded-3xl p-6 mb-6 reveal" style="animation-delay: 0.3s">
     <h2 class="font-display text-lg font-semibold text-stone-900 mb-4 flex items-center gap-2"><i data-lucide="clock" class="w-4 h-4"></i> Theo giờ</h2>
     <div id="hourly" class="flex gap-3 overflow-x-auto pb-2"></div>
    </section><!-- 7 day -->
    <section class="glass rounded-3xl p-6 reveal" style="animation-delay: 0.4s">
     <h2 class="font-display text-lg font-semibold text-stone-900 mb-4 flex items-center gap-2"><i data-lucide="calendar-days" class="w-4 h-4"></i> 7 ngày tới</h2>
     <div id="daily" class="divide-y divide-stone-900/10"></div>
    </section>
    <footer class="text-center text-xs text-stone-500 mt-8">
     Dữ liệu thời tiết chỉ mang tính minh họa
    </footer>
   </div>
  </main>
  <script>

// ====== CONFIG API ======
const API_KEY = "755b28e89d55cc940a392bf8356e9521";
const BASE_URL = "https://api.openweathermap.org/data/2.5/weather";

// ---------- Data ----------
  const CITIES = [
    { id: 'hanoi', name: 'Hà Nội', temp: 28, cond: 'sunny', condText: 'Nắng nhẹ', hi: 31, lo: 24, humidity: 72, wind: 12, uv: 7 },
    { id: 'hcm', name: 'TP. Hồ Chí Minh', temp: 32, cond: 'cloudy', condText: 'Nhiều mây', hi: 34, lo: 26, humidity: 78, wind: 9, uv: 8 },
    { id: 'danang', name: 'Đà Nẵng', temp: 30, cond: 'rainy', condText: 'Mưa rào', hi: 31, lo: 25, humidity: 85, wind: 18, uv: 4 },
    { id: 'hue', name: 'Huế', temp: 27, cond: 'stormy', condText: 'Mưa giông', hi: 29, lo: 23, humidity: 90, wind: 22, uv: 3 },
    { id: 'quangtri', name: 'Quảng Trị', temp: 26, cond: 'rainy', condText: 'Mưa rào', hi: 28, lo: 22, humidity: 88, wind: 20, uv: 3 },
    { id: 'quangbinh', name: 'Quảng Bình', temp: 25, cond: 'stormy', condText: 'Mưa giông', hi: 27, lo: 21, humidity: 92, wind: 24, uv: 2 },
    { id: 'quangnam', name: 'Quảng Nam', temp: 29, cond: 'rainy', condText: 'Có mưa', hi: 31, lo: 24, humidity: 84, wind: 16, uv: 4 },
    { id: 'quangngai', name: 'Quảng Ngãi', temp: 28, cond: 'cloudy', condText: 'Nhiều mây', hi: 30, lo: 23, humidity: 80, wind: 14, uv: 5 },
    { id: 'binhdinh', name: 'Bình Định', temp: 29, cond: 'sunny', condText: 'Nắng đẹp', hi: 32, lo: 24, humidity: 75, wind: 12, uv: 7 },
    { id: 'phuyen', name: 'Phú Yên', temp: 28, cond: 'cloudy', condText: 'Có mây', hi: 30, lo: 23, humidity: 76, wind: 13, uv: 6 },
    { id: 'khanhhoa', name: 'Khánh Hòa', temp: 29, cond: 'sunny', condText: 'Nắng đẹp', hi: 32, lo: 25, humidity: 70, wind: 14, uv: 9 },
    { id: 'ninhthuan', name: 'Ninh Thuận', temp: 30, cond: 'sunny', condText: 'Nắng nóng', hi: 33, lo: 26, humidity: 68, wind: 11, uv: 9 },
    { id: 'lamdong', name: 'Lâm Đồng', temp: 19, cond: 'cloudy', condText: 'Mát mẻ', hi: 22, lo: 14, humidity: 68, wind: 7, uv: 5 },
    { id: 'binhphuoc', name: 'Bình Phước', temp: 31, cond: 'cloudy', condText: 'Có mây', hi: 33, lo: 25, humidity: 72, wind: 10, uv: 8 },
    { id: 'kontum', name: 'Kon Tum', temp: 25, cond: 'stormy', condText: 'Mưa giông', hi: 27, lo: 20, humidity: 85, wind: 19, uv: 4 },
  ];

  const HOURLY_PATTERNS = {
    sunny:  [{t:26,c:'sunny'},{t:28,c:'sunny'},{t:30,c:'sunny'},{t:31,c:'sunny'},{t:30,c:'cloudy'},{t:28,c:'cloudy'},{t:26,c:'cloudy'},{t:24,c:'cloudy'}],
    cloudy: [{t:27,c:'cloudy'},{t:28,c:'cloudy'},{t:30,c:'cloudy'},{t:31,c:'sunny'},{t:30,c:'cloudy'},{t:29,c:'rainy'},{t:27,c:'rainy'},{t:26,c:'cloudy'}],
    rainy:  [{t:26,c:'rainy'},{t:27,c:'rainy'},{t:28,c:'cloudy'},{t:29,c:'rainy'},{t:28,c:'rainy'},{t:27,c:'cloudy'},{t:26,c:'cloudy'},{t:25,c:'rainy'}],
    stormy: [{t:24,c:'stormy'},{t:25,c:'rainy'},{t:26,c:'stormy'},{t:27,c:'stormy'},{t:26,c:'rainy'},{t:25,c:'rainy'},{t:24,c:'stormy'},{t:23,c:'rainy'}],
  };

  const DAYS = ['CN','T2','T3','T4','T5','T6','T7'];
  const FORECAST_BASE = [
    { c:'sunny', text:'Nắng', hi:31, lo:24 },
    { c:'cloudy', text:'Nhiều mây', hi:29, lo:23 },
    { c:'rainy', text:'Mưa rào', hi:27, lo:22 },
    { c:'stormy', text:'Mưa giông', hi:26, lo:21 },
    { c:'cloudy', text:'Có mây', hi:28, lo:22 },
    { c:'sunny', text:'Nắng đẹp', hi:32, lo:25 },
    { c:'sunny', text:'Nắng', hi:33, lo:26 },
  ];

  // ---------- Icons (SVG) ----------
  function weatherIcon(cond, size = 40) {
    const s = size;
    if (cond === 'sunny') {
      return `<svg width="${s}" height="${s}" viewBox="0 0 64 64" fill="none">
        <circle cx="32" cy="32" r="12" fill="#fbbf24"/>
        <g stroke="#f59e0b" stroke-width="3" stroke-linecap="round">
          <line x1="32" y1="6" x2="32" y2="14"/><line x1="32" y1="50" x2="32" y2="58"/>
          <line x1="6" y1="32" x2="14" y2="32"/><line x1="50" y1="32" x2="58" y2="32"/>
          <line x1="13" y1="13" x2="19" y2="19"/><line x1="45" y1="45" x2="51" y2="51"/>
          <line x1="51" y1="13" x2="45" y2="19"/><line x1="19" y1="45" x2="13" y2="51"/>
        </g></svg>`;
    }
    if (cond === 'cloudy') {
      return `<svg width="${s}" height="${s}" viewBox="0 0 64 64" fill="none">
        <circle cx="22" cy="22" r="9" fill="#fbbf24"/>
        <path d="M18 42 Q10 42 10 34 Q10 27 18 27 Q20 20 28 20 Q36 20 38 27 Q48 27 48 36 Q48 44 40 44 L18 44 Z" fill="#f5f5f4" stroke="#78716c" stroke-width="1.5"/>
      </svg>`;
    }
    if (cond === 'rainy') {
      return `<svg width="${s}" height="${s}" viewBox="0 0 64 64" fill="none">
        <path d="M14 28 Q8 28 8 22 Q8 16 14 16 Q16 10 22 10 Q30 10 32 16 Q42 16 42 24 Q42 32 34 32 L14 32 Z" fill="#d6d3d1" stroke="#57534e" stroke-width="1.5"/>
        <g stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round">
          <line x1="16" y1="40" x2="13" y2="50"/>
          <line x1="26" y1="40" x2="23" y2="50"/>
          <line x1="36" y1="40" x2="33" y2="50"/>
        </g></svg>`;
    }
    if (cond === 'stormy') {
      return `<svg width="${s}" height="${s}" viewBox="0 0 64 64" fill="none">
        <path d="M14 26 Q8 26 8 20 Q8 14 14 14 Q16 8 22 8 Q30 8 32 14 Q42 14 42 22 Q42 30 34 30 L14 30 Z" fill="#a8a29e" stroke="#44403c" stroke-width="1.5"/>
        <path d="M26 34 L20 46 L28 46 L22 58 L36 42 L28 42 L34 34 Z" fill="#fbbf24" stroke="#d97706" stroke-width="1.2"/>
      </svg>`;
    }
  }

  function bigVisual(cond) {
    if (cond === 'sunny') {
      return `<div class="sun-orb w-40 h-40 sm:w-52 sm:h-52 rounded-full"></div>`;
    }
    if (cond === 'cloudy') {
      return `<div class="relative">
        <div class="sun-orb absolute -top-4 -left-6 w-24 h-24 rounded-full opacity-80"></div>
        <div class="relative bg-white/90 rounded-full w-48 h-32 sm:w-56 sm:h-36 shadow-xl" style="border-radius: 50%"></div>
        <div class="absolute -bottom-2 left-8 bg-white/80 rounded-full w-24 h-16" style="border-radius: 50%"></div>
      </div>`;
    }
    if (cond === 'rainy' || cond === 'stormy') {
      const drops = Array.from({length: 8}).map((_, i) =>
        `<div class="rain-drop absolute w-0.5 h-4 bg-blue-500 rounded-full" style="left:${10 + i*12}%; top:70%; animation-delay:${i*0.15}s"></div>`
      ).join('');
      const bolt = cond === 'stormy' ? `<div class="absolute left-1/2 top-[60%] -translate-x-1/2 text-6xl">⚡</div>` : '';
      return `<div class="relative w-full h-full">
        <div class="absolute top-4 left-1/2 -translate-x-1/2 bg-stone-400/90 rounded-full w-48 h-28 sm:w-56 sm:h-32 shadow-xl" style="border-radius:50%"></div>
        <div class="absolute top-10 left-[20%] bg-stone-500/80 rounded-full w-24 h-16" style="border-radius:50%"></div>
        ${drops}
        ${bolt}
      </div>`;
    }
  }

  // ---------- State & rendering ----------
  let currentCityId = 'hanoi';
  let config = {};

  function renderCityTabs() {
    const container = document.getElementById('city-tabs');
    container.innerHTML = CITIES.map(c => `
      <button data-city="${c.id}" class="city-btn ${c.id === currentCityId ? 'active' : ''} shrink-0 px-4 py-2 rounded-full bg-white/50 hover:bg-white/80 text-stone-800 text-sm font-medium transition-colors">
        ${c.name}
      </button>
    `).join('');
    container.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => {
        currentCityId = btn.dataset.city;
        renderCityTabs();
        renderAll();
      });
    });
  }

  function renderCurrent() {
    const city = CITIES.find(c => c.id === currentCityId);
    document.getElementById('city-name').textContent = city.name;
    document.getElementById('current-temp').textContent = city.temp;
    document.getElementById('current-condition').textContent = city.condText;
    document.getElementById('current-range').textContent = `Cao ${city.hi}° / Thấp ${city.lo}°`;
    document.getElementById('stat-humidity').textContent = city.humidity + '%';
    document.getElementById('stat-wind').textContent = city.wind + ' km/h';
    document.getElementById('stat-uv').textContent = city.uv;
    document.getElementById('weather-visual').innerHTML = bigVisual(city.cond);
  }

  function renderHourly() {
    const city = CITIES.find(c => c.id === currentCityId);
    const hours = HOURLY_PATTERNS[city.cond];
    const now = new Date().getHours();
    const container = document.getElementById('hourly');
    container.innerHTML = hours.map((h, i) => {
      const hour = (now + i * 3) % 24;
      return `<div class="hour-card shrink-0 bg-white/40 rounded-2xl px-4 py-3 text-center min-w-[72px]">
        <div class="text-xs text-stone-600 mb-1">${String(hour).padStart(2,'0')}:00</div>
        <div class="flex justify-center my-1">${weatherIcon(h.c, 32)}</div>
        <div class="font-display font-bold text-stone-900">${h.t}°</div>
      </div>`;
    }).join('');
  }

  function renderDaily() {
    const city = CITIES.find(c => c.id === currentCityId);
    const today = new Date().getDay();
    // Seed first day with current city condition
    const forecast = FORECAST_BASE.map((d, i) => {
      if (i === 0) return { ...d, c: city.cond, text: city.condText, hi: city.hi, lo: city.lo };
      return d;
    });
    const container = document.getElementById('daily');
    container.innerHTML = forecast.map((d, i) => {
      const dayLabel = i === 0 ? 'Hôm nay' : DAYS[(today + i) % 7];
      return `<div class="day-row flex items-center gap-4 py-3 px-2 rounded-xl transition-colors">
        <div class="w-20 font-medium text-stone-800">${dayLabel}</div>
        <div class="w-10 flex justify-center">${weatherIcon(d.c, 32)}</div>
        <div class="flex-1 text-sm text-stone-700">${d.text}</div>
        <div class="font-display text-stone-600">${d.lo}°</div>
        <div class="w-20 h-1.5 rounded-full bg-gradient-to-r from-blue-300 via-yellow-300 to-orange-400"></div>
        <div class="font-display font-bold text-stone-900">${d.hi}°</div>
      </div>`;
    }).join('');
  }

  function updateClock() {
    const now = new Date();
    const dateStr = now.toLocaleDateString('vi-VN', { weekday: 'long', day: 'numeric', month: 'long' });
    const timeStr = now.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
    document.getElementById('current-date').textContent = dateStr.charAt(0).toUpperCase() + dateStr.slice(1);
    document.getElementById('current-time').textContent = timeStr;
  }

  function renderAll() {
    renderCurrent();
    renderHourly();
    renderDaily();
    lucide.createIcons();
  }

  function applyConfig(cfg) {
    document.getElementById('app-title').textContent = cfg.app_title || 'Weather';
    document.getElementById('app-subtitle').textContent = cfg.app_subtitle || 'Dự báo thời tiết';
  }

  // ---------- Element SDK ----------
  const defaultConfig = {
    app_title: 'Weather',
    app_subtitle: 'Dự báo thời tiết',
  };

  if (window.elementSdk) {
    window.elementSdk.init({
      defaultConfig,
      onConfigChange: async (cfg) => { applyConfig(cfg); },
      mapToCapabilities: () => ({
        recolorables: [],
        borderables: [],
        fontEditable: undefined,
        fontSizeable: undefined,
      }),
      mapToEditPanelValues: (cfg) => new Map([
        ['app_title', cfg.app_title || defaultConfig.app_title],
        ['app_subtitle', cfg.app_subtitle || defaultConfig.app_subtitle],
      ]),
    });
  }

  // ---------- Init ----------
  renderCityTabs();
  renderAll();
  updateClock();
  setInterval(updateClock, 1000 * 30);
</script>
